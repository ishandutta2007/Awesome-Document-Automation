<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Animated Glowing Orbs (SMIL animation for guaranteed GitHub & browser rendering) -->
  <circle cx="160" cy="90" r="130" fill="#38bdf8" opacity="0.14">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="5s" repeatCount="indefinite" />
    <animate attributeName="r" values="120;140;120" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="1040" cy="270" r="150" fill="#c084fc" opacity="0.16">
    <animate attributeName="opacity" values="0.10;0.25;0.10" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;165;140" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="600" cy="180" r="170" fill="#6366f1" opacity="0.10">
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing Dynamic Waves -->
  <path d="M -50 270 Q 300 350, 600 240 T 1250 180" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" opacity="0.6">
    <animate attributeName="d" values="M -50 270 Q 300 350, 600 240 T 1250 180; M -50 250 Q 300 320, 600 260 T 1250 200; M -50 270 Q 300 350, 600 240 T 1250 180" dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M -50 100 Q 400 30, 800 290 T 1250 130" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.4" />

  <!-- Background Decorative Tech Floating Cards -->
  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5s" repeatCount="indefinite" />
    <rect x="80" y="48" width="165" height="40" rx="20" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="162" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📄 PDF Generation</text>
  </g>

  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,9; 0,0" dur="6s" repeatCount="indefinite" />
    <rect x="945" y="52" width="175" height="40" rx="20" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="1032" y="77" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Template Engines</text>
  </g>

  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="5.5s" repeatCount="indefinite" />
    <rect x="960" y="268" width="160" height="40" rx="20" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="1040" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 AI Doc Agents</text>
  </g>

  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="6.5s" repeatCount="indefinite" />
    <rect x="75" y="272" width="185" height="40" rx="20" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="167" y="297" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 Workflow Automation</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high contrast & visibility) -->
  <!-- Tag Badge -->
  <rect x="475" y="55" width="250" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#38bdf8">✨ CURATED ECOSYSTEM 2026 ✨</text>

  <!-- Main Title -->
  <text x="600" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="url(#titleGrad)">Awesome Document Automation</text>

  <!-- Divider Line -->
  <rect x="420" y="176" width="360" height="3" rx="1.5" fill="url(#titleGrad)" />

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Top SaaS Platforms, Open-Source Template Engines &amp; AI Document Workflows</text>

  <!-- Subtitle Bullet Points -->
  <text x="600" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">🚀 Enterprise Templating &nbsp;|&nbsp; 📄 Native PDF/DOCX Engines &nbsp;|&nbsp; ⚡ Developer APIs</text>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
